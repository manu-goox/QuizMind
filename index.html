<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#0a0a18" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var THEME_COLORS = {
          dark: '#0a0a18',
          light: '#e8edf3',
          catppuccin: '#1e1e2e',
        };
        var theme = { id: 'dark', file: '/themes/dark.css' };
        try {
          var stored = JSON.parse(
            localStorage.getItem('quizmind-settings') || 'null',
          );
          if (
            stored &&
            stored.theme &&
            typeof stored.theme.file === 'string' &&
            typeof stored.theme.id === 'string'
          ) {
            theme = stored.theme;
          }
        } catch (error) {
          /* localStorage no disponible: se usa el tema por defecto */
        }
        var link = document.createElement('link');
        link.id = 'theme-css';
        link.rel = 'stylesheet';
        link.href = theme.file;
        document.head.appendChild(link);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute(
            'content',
            THEME_COLORS[theme.id] || THEME_COLORS.dark,
          );
        }
      })();
    </script>
    <title>QuizMind - Tests Interactivos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
