<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180" role="img" aria-label="QuizMind — interactive quiz experience">
  <defs>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="auroraA" cx="12%" cy="-20%" r="70%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e94560" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auroraB" cx="88%" cy="-10%" r="70%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auroraC" cx="50%" cy="130%" r="85%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="760" height="180" rx="24" fill="#0a0a18" />
  <rect width="760" height="180" rx="24" fill="url(#auroraA)" />
  <rect width="760" height="180" rx="24" fill="url(#auroraB)" />
  <rect width="760" height="180" rx="24" fill="url(#auroraC)" />
  <rect x="0.5" y="0.5" width="759" height="179" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" />

  <g transform="translate(227, 46)" filter="url(#softGlow)">
    <circle cx="24" cy="24" r="18" fill="none" stroke="url(#wordmark)" stroke-width="7" />
    <line x1="38" y1="38" x2="52" y2="52" stroke="url(#wordmark)" stroke-width="7" stroke-linecap="round" />
  </g>

  <text x="308" y="93" font-family="'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5" fill="url(#wordmark)" filter="url(#softGlow)">QuizMind</text>

  <text x="380" y="138" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="5.5" fill="#7c819c">INTERACTIVE QUIZ EXPERIENCE</text>
</svg>
