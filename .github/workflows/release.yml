name: Release

on:
  push:
    tags: [v*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Auto-updates may only be published from main: reject any tag or manual run
  # whose commit is not an ancestor of origin/main.
  verify-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  publish:
    needs: verify-main
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npm test
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
            git fetch --tags --force
            if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::error::tag $tag already exists — bump the version in src-tauri/tauri.conf.json before releasing"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: QuizMind v__VERSION__
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
      # The updater must download straight from the release page: API asset URLs
      # are rate limited for anonymous requests and would fail silently.
      # Paths stay relative on purpose: git-bash /tmp paths are not understood
      # by native Windows tools (gh, node) and broke a previous run.
      - name: Point updater JSON at direct download URLs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          asset="QuizMind_${version}_x64-setup.exe"
          direct="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${asset}"
          mkdir -p updater-json
          gh release download "$tag" --pattern 'latest.json' --dir updater-json --clobber
          node -e "const fs=require('fs');const p='updater-json/latest.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));for(const k of Object.keys(j.platforms)){j.platforms[k].url='${direct}';}fs.writeFileSync(p,JSON.stringify(j,null,2));"
          gh release upload "$tag" updater-json/latest.json --clobber
      - name: Verify updater JSON points at direct download URLs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          mkdir -p verify-json
          gh release download "$tag" --pattern 'latest.json' --dir verify-json --clobber
          node -e "const j=require('./verify-json/latest.json');let bad=0;for(const k of Object.keys(j.platforms)){const u=j.platforms[k].url;if(!u.startsWith('https://github.com/')){console.error('BAD URL',k,u);bad=1;}else{console.log('OK',k,u);}}process.exit(bad);"
